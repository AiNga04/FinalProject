server:
  port: 8080

spring:
  config:
    import: "file:./.env[.properties]"

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/TestingSystem
    username: testing_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: testing-system
    secret-base64: ${JWT_SECRET_BASE64}
    access-token-minutes: 15
    refresh-token-days: 7
