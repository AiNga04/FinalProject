server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  config:
    import: "file:./.env[.properties]"

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/TestingSystem
    username: testing_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: true
        page-parameter: pageNumber
        size-parameter: size

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  storage:
    avatar-dir: ./storage/avatars
  jwt:
    issuer: testing-system
    secret-base64: ${JWT_SECRET_BASE64}
    access-token-minutes: 15
    refresh-token-days: 7
